openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TimexFrame API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: video
    description: Video upload and frame extraction
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /upload:
    post:
      operationId: uploadVideo
      tags: [video]
      summary: Upload a video file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
              required: [video]
      responses:
        "200":
          description: Video uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /extract:
    post:
      operationId: extractFrames
      tags: [video]
      summary: Extract frames from uploaded video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Frames extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /frames:
    get:
      operationId: getFrames
      tags: [video]
      summary: Get list of extracted frames
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of frames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FramesResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download-zip:
    post:
      operationId: downloadZip
      tags: [video]
      summary: Download selected frames as ZIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadZipRequest"
      responses:
        "200":
          description: ZIP file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    UploadResponse:
      type: object
      properties:
        sessionId:
          type: string
        filename:
          type: string
        duration:
          type: number
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
      required: [sessionId, filename, duration, size]

    ExtractRequest:
      type: object
      properties:
        sessionId:
          type: string
        mode:
          type: string
          enum: [timestamp, interval, framecount, smart]
          description: "Extraction mode: interval, timestamp, framecount, or smart"
        # Interval mode
        interval:
          type: number
          description: Interval in seconds (interval mode)
        startTime:
          type: string
          description: Start time HH:MM:SS (optional, interval/framecount modes)
        endTime:
          type: string
          description: End time HH:MM:SS (optional, interval/framecount modes)
        # Timestamp mode - single or multiple
        timestamp:
          type: string
          description: Single timestamp HH:MM:SS (legacy)
        timestamps:
          type: array
          items:
            type: string
          description: Multiple timestamps HH:MM:SS for timestamp mode
        # Frame count mode
        frameCount:
          type: integer
          minimum: 1
          maximum: 200
          description: Total number of frames to extract evenly distributed
        # Smart mode filters
        avoidBlurry:
          type: boolean
          description: Filter out blurry frames
        preferBright:
          type: boolean
          description: Prefer well-lit frames
        detectSceneChanges:
          type: boolean
          description: Extract frames at scene change boundaries
        # Output options
        quality:
          type: integer
          minimum: 1
          maximum: 100
        format:
          type: string
          enum: [jpg, png, webp]
          description: Output image format
        skipFirstSeconds:
          type: number
          description: Skip first N seconds of video
      required: [sessionId, mode]

    ExtractResponse:
      type: object
      properties:
        sessionId:
          type: string
        frameCount:
          type: integer
        frames:
          type: array
          items:
            $ref: "#/components/schemas/Frame"
      required: [sessionId, frameCount, frames]

    Frame:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        url:
          type: string
        timestamp:
          type: number
        suggested:
          type: boolean
        sharpness:
          type: number
        brightness:
          type: number
      required: [id, filename, url, timestamp, suggested, sharpness, brightness]

    FramesResponse:
      type: object
      properties:
        sessionId:
          type: string
        frames:
          type: array
          items:
            $ref: "#/components/schemas/Frame"
      required: [sessionId, frames]

    DownloadZipRequest:
      type: object
      properties:
        sessionId:
          type: string
        frameIds:
          type: array
          items:
            type: string
      required: [sessionId, frameIds]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
